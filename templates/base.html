<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NetScope</title>

  <link
    rel="stylesheet"
    href="{{ url_for('static', filename='style.css') }}"
  >
</head>

<body>

  <header>
    <div class="brand">NetScope</div>

    <nav>
      <a href="{{ url_for('index') }}">Scanner</a>
      <a href="{{ url_for('history') }}">History</a>
    </nav>

    <div class="user-info">
      <div class="avatar">K</div>
      <div>
        <strong>Kumaresh</strong>
        <span>Administrator</span>
      </div>
    </div>
  </header>

  <main>

    {% with messages = get_flashed_messages() %}
      {% for message in messages %}
        <div class="alert">
          {{ message }}
        </div>
      {% endfor %}
    {% endwith %}

    {% block content %}
    {% endblock %}

  </main>

  <footer>
    NetScope · Created by Kumaresh
  </footer>

</body>
</html>
